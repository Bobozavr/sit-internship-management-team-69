spring.application.name=internship-management

spring.datasource.url=jdbc:postgresql://localhost:5432/internship_management
spring.datasource.username=your_username
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
# JWT (keep the real secret in local environment variables / application.properties)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Pre-created admin account for MVP (override locally)
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:admin12345}

springdoc.swagger-ui.path=/swagger-ui/index.html
